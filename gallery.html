<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Gallery - Jess</title>
  <!-- SEO / Social tags: update `https://example.com` and placeholders to your real domain and data -->
  <link rel="canonical" href="https://example.com/gallery.html">
  <meta name="description" content="A curated gallery of work by Jess — product design and marketing case studies.">
  <meta name="keywords" content="portfolio, work, case studies, product design, UX">
  <meta name="author" content="Jess">
  <meta name="geo.position" content="LAT;LON">
  <meta name="geo.placename" content="City Name">
  <meta name="geo.region" content="Region/State">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Work — Jess">
  <meta property="og:description" content="A curated gallery of work by Jess — product design and marketing case studies.">
  <meta property="og:image" content="https://example.com/media/logo.png">
  <meta property="og:url" content="https://example.com/gallery.html">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Work — Jess">
  <meta name="twitter:description" content="A curated gallery of work by Jess — product design and marketing case studies.">
  <meta name="twitter:image" content="https://example.com/media/logo.png">

  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="media/logo.png" type="image/png">

  <!-- JSON-LD structured data (replace placeholders with real values) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Work — Jess",
    "url": "https://example.com/gallery.html",
    "description": "A curated gallery of work by Jess — product design and marketing case studies.",
    "image": "https://example.com/media/logo.png"
  }
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="head.js" defer></script>
  <script src="footer.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <div id="gallery-container"></div>
    <div class="back-to-top">
      <button class="btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">Back to top</button>
    </div>
  </main>

  <div id="footer-container"></div>
</body>
</html>
